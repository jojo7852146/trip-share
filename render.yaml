# Render deployment config
# 1. Push this folder to a GitHub repo (没有 GitHub 账号？先用 https://github.com 注册一个)
# 2. Go to https://render.com → Sign in with GitHub
# 3. Dashboard → New + → Blueprint → select your repo
# 4. Render reads render.yaml → shows two resources (web + postgres) → click "Apply"
# 5. Wait ~3 min for first build; URL appears on dashboard
#
# After deploy, the DATABASE_URL env var is automatically injected into
# the web service, so db.py connects without any manual config.

services:
  - type: pserv
    name: trip-share-db
    plan: free
    region: oregon
    # free Postgres on Render: 1 GB storage, expires after 90 days of inactivity
    # (render will email you a renewal link). For long-term data, upgrade to
    # the $7/mo "Starter" plan or migrate to Neon / Supabase later.

  - type: web
    name: trip-share
    env: python
    plan: free
    region: oregon
    runtime: python-3.11.10
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      # 自动注入 Render 提供的 Postgres 连接字符串
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: trip-share-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: SECRET_KEY
        generateValue: true   # 未来如果要升级 token 为 JWT 就有现成的 key
