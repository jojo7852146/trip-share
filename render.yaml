# Render Blueprint for trip-share.
# - Provisions a free Postgres database + free Web service.
# - DATABASE_URL is auto-injected into the web service.

databases:
  - name: trip-share-db
    plan: free
    databaseName: trip_share
    user: trip_share

services:
  - type: web
    name: trip-share
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trip-share-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
