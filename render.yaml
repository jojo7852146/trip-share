# Render Blueprint deployment config (Render 2023+ spec).
#
# 1. Push this folder to a GitHub repo (没有 GitHub 账号？先用 https://github.com 注册一个)
# 2. Go to https://render.com → Sign in with GitHub
# 3. Dashboard → New + → Blueprint → select your repo
# 4. Render reads render.yaml → shows two resources (web + postgres) → click "Apply"
# 5. Wait ~3 min for first build; URL appears on dashboard
#
# After deploy, the DATABASE_URL env var is automatically injected into
# the web service, so db.py connects without any manual config.
#
# NOTE: runtime.txt pins Python to 3.13.7. Render's default is 3.14+,
# which would break psycopg2-binary 2.9.x. We use psycopg 3 which works
# on 3.13 AND 3.14, so even if Render ignores runtime.txt the build
# should still succeed. Both paths are safe.

databases:
  - name: trip-share-db
    plan: free
    databaseName: trip_share
    user: trip_share
    # Free plan: 1 GB storage, expires after 90 days of inactivity.
    # Render will email you a renewal link. For long-term data, upgrade
    # to "$7/mo Starter" plan or migrate to Neon/Supabase.

services:
  - type: web
    name: trip-share
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trip-share-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
